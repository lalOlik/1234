name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x "КГЭУ ЛК/gradlew"

      - name: Build APK
        working-directory: "КГЭУ ЛК"
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KGEU-LK-debug
          path: "КГЭУ ЛК/app/build/outputs/apk/debug/app-debug.apk"
